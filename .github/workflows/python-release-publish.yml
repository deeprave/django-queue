name: Build and Publish Python Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example, v1.0.0)
        required: true
        type: string

env:
  TARGET_PYTHON_VERSION: '3.14'

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Test and Build
        uses: ./.github/actions/test-and-build
        with:
          python-version: ${{ matrix.python-version }}

      - name: build and publish package
        if: matrix.python-version == env.TARGET_PYTHON_VERSION
        shell: bash
        run: uv publish
